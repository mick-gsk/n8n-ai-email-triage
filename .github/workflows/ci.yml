name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: workflow exports match src/
        run: |
          npm run build
          # status, not diff, so a new export that was never committed fails too
          changes=$(git status --porcelain -- '*.json')
          if [ -n "$changes" ]; then echo "$changes"; git diff; exit 1; fi
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

